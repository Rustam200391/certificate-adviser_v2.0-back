databaseChangeLog:
  - changeSet:
      id: 002-add-created-at-to-certificates
      author: dev
      changes:
        - addColumn:
            tableName: certificates
            columns:
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
